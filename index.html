<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅のしおり | Trip Album</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>友人との旅行しおり</h1>
  <p class="subtitle">2026年 サンプルトリップ ― 写真・動画ギャラリー</p>
</header>

<main class="gallery" id="gallery">
  <button class="card" data-type="image" data-full="images/photo1.svg" data-caption="写真 1 のキャプションをここに">
    <img src="images/photo1.svg" alt="写真 1" loading="lazy">
  </button>
  <button class="card" data-type="image" data-full="images/photo2.svg" data-caption="写真 2 のキャプションをここに">
    <img src="images/photo2.svg" alt="写真 2" loading="lazy">
  </button>
  <button class="card" data-type="video" data-full="images/video1.svg" data-caption="動画 1 のキャプションをここに">
    <img src="images/video1.svg" alt="動画 1" loading="lazy">
    <span class="play-badge">▶</span>
  </button>
  <button class="card" data-type="image" data-full="images/photo3.svg" data-caption="写真 3 のキャプションをここに">
    <img src="images/photo3.svg" alt="写真 3" loading="lazy">
  </button>
  <button class="card" data-type="image" data-full="images/photo4.svg" data-caption="写真 4 のキャプションをここに">
    <img src="images/photo4.svg" alt="写真 4" loading="lazy">
  </button>
  <button class="card" data-type="video" data-full="images/video2.svg" data-caption="動画 2 のキャプションをここに">
    <img src="images/video2.svg" alt="動画 2" loading="lazy">
    <span class="play-badge">▶</span>
  </button>
  <button class="card" data-type="image" data-full="images/photo5.svg" data-caption="写真 5 のキャプションをここに">
    <img src="images/photo5.svg" alt="写真 5" loading="lazy">
  </button>
  <button class="card" data-type="image" data-full="images/photo6.svg" data-caption="写真 6 のキャプションをここに">
    <img src="images/photo6.svg" alt="写真 6" loading="lazy">
  </button>
</main>

<footer>
  <p>images フォルダの写真・動画を差し替えるだけで、実際の旅行アルバムになります。</p>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="閉じる">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="前へ">&#10094;</button>
  <div class="lightbox-content">
    <img id="lightboxImage" src="" alt="">
    <p id="lightboxCaption" class="lightbox-caption"></p>
    <p id="lightboxVideoNote" class="lightbox-video-note" hidden>この枠はサンプルです。実際の動画ファイルに差し替えてください。</p>
  </div>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="次へ">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
